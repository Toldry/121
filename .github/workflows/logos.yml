# Downloads party logos from Wikimedia Commons (scripts/fetch-logos.ts) and
# commits them to main.
name: Fetch party logos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-logos.ts
      - name: Commit logos
        run: |
          git add public/logos src/data/logos.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fetch party logos from Wikimedia Commons"
          git push origin HEAD:main
